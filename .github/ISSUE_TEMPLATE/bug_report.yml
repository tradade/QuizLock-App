name: Bug report
description: Report a reproducible problem with QuizLock.
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve QuizLock. Please do not include PINs, recovery
        codes, child names, or other personal data in this report.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Samsung Tab A9, Android 14 / Xiaomi TV Box, Android 11"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuizLock version / build
      placeholder: "1.0 (debug) or commit SHA"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact personal data before posting.
    validations:
      required: false
