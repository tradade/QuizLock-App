name: Feature request
description: Suggest an improvement for QuizLock.
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What parent/child problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android TV / Google TV
        - Tablet
        - Smartphone
        - All platforms
    validations:
      required: true
